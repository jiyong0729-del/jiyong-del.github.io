<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>테트리스 & 프로젝트 백로그</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0f172a;color:#f8fafc;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow-x:hidden}
#container{max-width:500px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:20px}

header{text-align:center;padding:10px 0;border-bottom:1px solid #334155}
header h1{font-size:24px;color:#38bdf8;font-weight:800}
header p{font-size:13px;color:#94a3b8;margin-top:4px}

/* 테트리스 게임 레이아웃 */
#game-box{background:#1e293b;border-radius:16px;padding:16px;border:1px solid #334155;display:flex;flex-direction:column;align-items:center;gap:12px}
.game-info{display:flex;justify-content:space-between;width:100%;max-width:300px;font-weight:700;font-size:15px;color:#cbd5e1}
.info-card{background:#0f172a;padding:8px 14px;border-radius:8px;border:1px solid #334155;text-align:center}
.info-card span{color:#38bdf8;font-size:18px;display:block}

#canvas-wrap{position:relative}
canvas{border-radius:8px;border:2px solid #334155;background:#0f172a;display:block;touch-action:none}

/* 모바일 모션 조작 버튼 */
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px}
.btn{background:#334155;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;text-align:center;transition:background 0.1s}
.btn:active{background:#38bdf8;color:#0f172a}
.btn-drop{grid-column:span 3;background:#0284c7}

/* 오버레이 팝업 */
.ov{position:absolute;inset:0;background:rgba(15,23,42,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:8px;z-index:10;text-align:center;padding:16px}
.ov h2{font-size:28px;color:#38bdf8}
.ov p{color:#94a3b8;font-size:14px}
.ov button{font-size:16px;font-weight:800;padding:10px 24px;border-radius:8px;border:none;background:#38bdf8;color:#0f172a;cursor:pointer}
.hide{display:none !important}

/* 백로그 섹션 */
.backlog-section{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #334155}
.backlog-section h2{font-size:18px;color:#38bdf8;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.backlog-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.backlog-item{background:#0f172a;padding:10px 12px;border-radius:8px;font-size:13px;color:#cbd5e1;display:flex;align-items:center;gap:8px}
.badge{background:#334155;color:#38bdf8;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:bold}
</style>
</head>
<body>

<div id="container">
  <header>
    <h1>Namryuk Tetris</h1>
    <p>GitHub Pages 배포 및 다음 스프린트 백로그</p>
  </header>

  <!-- 게임 영역 -->
  <div id="game-box">
    <div class="game-info">
      <div class="info-card">SCORE<span id="score">0</span></div>
      <div class="info-card">LINES<span id="lines">0</span></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="tetris" width="240" height="400"></canvas>
      <div class="ov" id="ov">
        <h2 id="ovT">TETRIS</h2>
        <p id="ovP">방향키 또는 아래 버튼으로 조작하세요.</p>
        <button id="start-btn">게임 시작</button>
      </div>
    </div>

    <!-- 모바일 조작 버튼 -->
    <div class="controls">
      <button class="btn" onclick="playerMove(-1)">◀</button>
      <button class="btn" onclick="playerRotate(1)">🔄</button>
      <button class="btn" onclick="playerMove(1)">▶</button>
      <button class="btn" onclick="playerDrop()">▼</button>
      <button class="btn btn-drop" onclick="hardDrop()">SPACE (HARD DROP)</button>
    </div>
  </div>

  <!-- 과제 평가 요구사항: Next Sprint Backlog -->
  <div class="backlog-section">
    <h2>📋 Next Sprint Backlog (할 일 목록)</h2>
    <ul class="backlog-list">
      <li class="backlog-item"><span class="badge">Sprint 2</span> 다음 블록(Next Block) 미리보기 영역 구현</li>
      <li class="backlog-item"><span class="badge">Sprint 2</span> 레벨 시스템 및 속도 증가 로직 추가</li>
      <li class="backlog-item"><span class="badge">Sprint 3</span> 최고 점수(High Score) 로컬스토리지 저장 기능</li>
    </ul>
  </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

// 블록 색상 설정
const colors = [
  null,
  '#00f0f0', // I
  '#0000f0', // J
  '#f0a000', // L
  '#f0f000', // O
  '#00f000', // S
  '#a000f0', // T
  '#f00000'  // Z
];

// 테트리스 보드 생성 (12x20)
function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

// 블록 모양 정의
function createPiece(type) {
  if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
  else if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
  else if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
  else if (type === 'O') return [[4,4],[4,4]];
  else if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
  else if (type === 'T') return [[0,6,0],[6,6,6],[0,0,0]];
  else if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
}

const arena = createMatrix(12, 20);
const player = { pos: {x: 0, y: 0}, matrix: null, score: 0, lines: 0 };

function collide(arena, player) {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
    });
  });
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y >= 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    player.score += rowCount * 10;
    player.lines += 1;
    rowCount *= 2;
  }
  updateScore();
}

function draw() {
  context.fillStyle = '#0f172a';
  context.fillRect(0, 0, canvas.width, canvas.height);
  drawMatrix(arena, {x: 0, y: 0});
  drawMatrix(player.matrix, player.pos);
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        context.fillStyle = colors[value];
        context.fillRect(x + offset.x, y + offset.y, 1, 1);
        context.lineWidth = 0.05;
        context.strokeStyle = '#0f172a';
        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

function playerDrop() {
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
  }
  dropCounter = 0;
}

function hardDrop() {
  while (!collide(arena, player)) {
    player.pos.y++;
  }
  player.pos.y--;
  merge(arena, player);
  playerReset();
  arenaSweep();
  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;
  if (collide(arena, player)) player.pos.x -= dir;
}

function playerRotate(dir) {
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerReset() {
  const pieces = 'IJLOSTZ';
  player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
  player.pos.y = 0;
  player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
  if (collide(arena, player)) {
    gameOver();
  }
}

function updateScore() {
  document.getElementById('score').innerText = player.score;
  document.getElementById('lines').innerText = player.lines;
}

function gameOver() {
  gameRunning = false;
  document.getElementById('ovT').innerText = 'GAME OVER';
  document.getElementById('ovP').innerText = `최종 점수: ${player.score}점`;
  document.getElementById('start-btn').innerText = '다시 시작';
  document.getElementById('ov').classList.remove('hide');
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let gameRunning = false;

function update(time = 0) {
  if (!gameRunning) return;
  const deltaTime = time - lastTime;
  lastTime = time;
  dropCounter += deltaTime;
  if (dropCounter > dropInterval) playerDrop();
  draw();
  requestAnimationFrame(update);
}

document.addEventListener('keydown', event => {
  if (!gameRunning) return;
  if (event.keyCode === 37) playerMove(-1);       // Left
  else if (event.keyCode === 39) playerMove(1);   // Right
  else if (event.keyCode === 40) playerDrop();     // Down
  else if (event.keyCode === 38) playerRotate(1);  // Up
  else if (event.keyCode === 32) hardDrop();       // Space
});

document.getElementById('start-btn').onclick = () => {
  arena.forEach(row => row.fill(0));
  player.score = 0;
  player.lines = 0;
  updateScore();
  playerReset();
  document.getElementById('ov').classList.add('hide');
  gameRunning = true;
  lastTime = performance.now();
  update();
};
</script>
</body>
</html>
